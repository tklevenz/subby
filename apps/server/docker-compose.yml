# Self-hosting Subby Sync: the server, Postgres, and (optionally) Caddy for automatic HTTPS.
#   cp docker.env.example .env   # set POSTGRES_PASSWORD (and DOMAIN for HTTPS)
#   docker compose up -d --build                   # plain HTTP on port 8787 (LAN or a VPN)
#   docker compose --profile https up -d --build   # HTTPS on DOMAIN via Let's Encrypt (ports 80 and 443)
# See README.md in this folder.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kindred
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kindred
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kindred -d kindred"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: kindred-sync:latest
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kindred:${POSTGRES_PASSWORD}@db:5432/kindred
      MODE: ${MODE:-self}
      BLOB_STORE: ${BLOB_STORE:-disk}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PUSH: ${PUSH:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
    volumes:
      - blobs:/data
      # Put the Firebase service-account key here for PUSH=fcm (FCM_SERVICE_ACCOUNT=/secrets/firebase.json).
      - ./secrets:/secrets:ro
    ports:
      # With the https profile, set HTTP_BIND=127.0.0.1 so plain HTTP isn't reachable from outside (Caddy talks
      # to the server over the compose network, not this port).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-} --to server:8787
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - server

volumes:
  db:
  blobs:
  caddy:
