# Self-hosting Subby Sync: the server, Postgres, and (optionally) Caddy for automatic HTTPS.
#   cp docker.env.example .env   # set POSTGRES_PASSWORD (and DOMAIN for HTTPS)
#   docker compose up -d --build                   # plain HTTP on port 8787 (LAN or a VPN)
#   docker compose --profile https up -d --build   # HTTPS on DOMAIN via Let's Encrypt (ports 80 and 443)
#   With HTTPS, also set HTTP_BIND=127.0.0.1 in .env: plain HTTP is otherwise still open on port 8787.
#   With HTTPS, also set TRUST_PROXY=uniquelocal, so request limits see each client's IP, not Caddy's.
# See README.md in this folder.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: subby
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subby -d subby"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: subby-sync:latest
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://subby:${POSTGRES_PASSWORD}@db:5432/subby
      MODE: ${MODE:-self}
      BLOB_STORE: ${BLOB_STORE:-disk}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PUSH: ${PUSH:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      RATE_LIMIT: ${RATE_LIMIT:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${GOOGLE_PLAY_SERVICE_ACCOUNT:-}
      GOOGLE_PLAY_PACKAGE: ${GOOGLE_PLAY_PACKAGE:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_ALLOW_SANDBOX: ${APPLE_ALLOW_SANDBOX:-}
      APPLE_IAP: ${APPLE_IAP:-}
      TEST_PURCHASES: ${TEST_PURCHASES:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - blobs:/data
      # Put the Firebase service-account key here for PUSH=fcm (FCM_SERVICE_ACCOUNT=/secrets/firebase.json),
      # and the APNs key for iOS push (APNS_KEY=/secrets/apns.p8).
      - ./secrets:/secrets:ro
    ports:
      # With the https profile, set HTTP_BIND=127.0.0.1 so plain HTTP isn't reachable from outside (Caddy talks
      # to the server over the compose network, not this port).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-} --to server:8787
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - server

volumes:
  postgres:
  blobs:
  caddy:
