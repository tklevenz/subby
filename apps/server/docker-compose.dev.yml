# Development database only. Port 54329 so it never clashes with a local Postgres.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: subby
      POSTGRES_PASSWORD: subby
      POSTGRES_DB: subby
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - subby-dev-db:/var/lib/postgresql/data
volumes:
  subby-dev-db:
