# The official Subby Sync at sync.subby.baby (LAUNCH.md O1). Self-hosters: use ../../docker-compose.yml instead.
# Lives in /opt/subby on the server, next to .env (from env.example) and secrets/. deploy.sh installs it and sets
# IMAGE_TAG; nothing is built on the server. Tuned for a 1 GB box (Hetzner CPX02 with 2 GB swap).

# Docker keeps container logs forever by default: at most 5 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: subby
    # Small memory settings: the rows are small and the disk is NVMe.
    command: >
      postgres
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subby -d subby"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    logging: *logging
    image: subby-sync:${IMAGE_TAG:?Deploy with deploy.sh (it sets IMAGE_TAG)}
    restart: unless-stopped
    # Only what the server reads (src/config.ts), never the whole .env: the backup bucket's keys and the
    # Healthchecks URLs there are for backup.sh and monitor.sh on the host, out of reach of the server.
    environment:
      DATABASE_URL: postgres://subby:${POSTGRES_PASSWORD}@db:5432/subby
      MODE: ${MODE:?Set MODE in .env}
      TRUST_PROXY: ${TRUST_PROXY:-}
      BLOB_STORE: ${BLOB_STORE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      PUSH: ${PUSH:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${GOOGLE_PLAY_SERVICE_ACCOUNT:-}
      GOOGLE_PLAY_PACKAGE: ${GOOGLE_PLAY_PACKAGE:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_ALLOW_SANDBOX: ${APPLE_ALLOW_SANDBOX:-}
      APPLE_IAP: ${APPLE_IAP:-}
      RATE_LIMIT: ${RATE_LIMIT:-}
      METRICS_PORT: ${METRICS_PORT:-}
      # The pretend store must never run here.
      TEST_PURCHASES: "0"
      NODE_OPTIONS: --max-old-space-size=320
    volumes:
      # The push keys: Firebase (FCM_SERVICE_ACCOUNT=/secrets/firebase.json) and APNs (APNS_KEY=/secrets/apns.p8).
      - ./secrets:/secrets:ro
    # No published port: only Caddy, on the compose network, reaches the server.
    depends_on:
      db:
        condition: service_healthy

  caddy:
    logging: *logging
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      SITE_DOMAIN: ${SITE_DOMAIN:-subby.baby}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The homepage's files (site.sh copies them here).
      - ./site:/srv/site:ro
      - caddy:/data
    depends_on:
      - server

volumes:
  postgres:
  caddy:
